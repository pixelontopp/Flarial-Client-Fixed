name: Patch Flarial APK

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Download tools
      run: |
        wget -q "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" \
          -O apktool.jar
        wget -q "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool" \
          -O apktool && chmod +x apktool
        wget -q "https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar" \
          -O APKEditor.jar
        echo "Tools ready ✓"

    - name: Find apksigner and zipalign from Android SDK
      run: |
        BUILD_TOOLS_ROOT="/usr/local/lib/android/sdk/build-tools"
        LATEST=$(ls "$BUILD_TOOLS_ROOT" | sort -V | tail -1)
        echo "Using build-tools: $LATEST"
        echo "APKSIGNER=$BUILD_TOOLS_ROOT/$LATEST/apksigner" >> $GITHUB_ENV
        echo "ZIPALIGN=$BUILD_TOOLS_ROOT/$LATEST/zipalign"   >> $GITHUB_ENV

    - name: Download APKS from release v1
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        RELEASE_JSON=$(curl -s \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/releases/tags/v1")

        echo "Assets in release v1:"
        echo "$RELEASE_JSON" | python3 -c "
        import sys, json
        data = json.load(sys.stdin)
        if 'message' in data:
            print('ERROR:', data['message'])
            sys.exit(1)
        for a in data.get('assets', []):
            print(f'  - {a[\"name\"]} ({a[\"size\"]} bytes)')
        "

        DOWNLOAD_URL=$(echo "$RELEASE_JSON" | python3 -c "
        import sys, json
        data = json.load(sys.stdin)
        for ext in ('.apks', '.apk'):
            for a in data.get('assets', []):
                if a['name'].endswith(ext):
                    print(a['browser_download_url'])
                    sys.exit(0)
        sys.exit(1)
        ")

        IS_APK=false
        echo "$DOWNLOAD_URL" | grep -q '\.apk$' && IS_APK=true

        echo "Downloading: $DOWNLOAD_URL"
        curl -L -s \
          -H "Authorization: Bearer $GH_TOKEN" \
          "$DOWNLOAD_URL" -o flarial_input

        echo "Downloaded: $(du -sh flarial_input | cut -f1)"
        echo "IS_APK=$IS_APK" >> $GITHUB_ENV

    - name: Merge splits into single APK
      run: |
        if [ "$IS_APK" = "true" ]; then
          echo "Plain .apk — skipping merge"
          cp flarial_input flarial_merged.apk
        else
          echo "Merging split APKs..."
          java -jar APKEditor.jar m \
            -i flarial_input \
            -o flarial_merged.apk
          echo "Merged: $(du -sh flarial_merged.apk | cut -f1)"
        fi

    - name: Decompile APK
      run: |
        java -jar apktool.jar d flarial_merged.apk \
          -o flarial_decompiled \
          --no-res \
          -f
        echo "Smali dirs:"
        ls flarial_decompiled/ | grep smali

    - name: Delete anti-tamper and ad native libs
      run: |
        LIB_DIR="flarial_decompiled/lib"

        KILL_LIBS=(
          "libpglarmor.so"
          "libapplovin-native-crash-reporter.so"
          "libapminsighta.so"
          "libapminsightb.so"
          "libtt_ugen_layout.so"
          "libshin.so"
          "libmaesdk.so"
        )

        DELETED=0
        for arch in arm64-v8a armeabi-v7a x86 x86_64; do
          for lib in "${KILL_LIBS[@]}"; do
            TARGET="$LIB_DIR/$arch/$lib"
            if [ -f "$TARGET" ]; then
              rm "$TARGET"
              echo "  DELETED ✓ $arch/$lib"
              DELETED=$((DELETED + 1))
            fi
          done
        done

        echo "Total deleted: $DELETED .so files"

    - name: Patch smali
      run: |
        python3 << 'PYEOF'
        import os, re, glob

        BASE = "flarial_decompiled"
        patched = []
        scanned = 0

        def smali_files():
            for d in sorted(glob.glob(f"{BASE}/smali*")):
                for root, _, files in os.walk(d):
                    for f in files:
                        if f.endswith(".smali"):
                            yield os.path.join(root, f)

        def read(path):
            with open(path, "r", encoding="utf-8", errors="ignore") as fh:
                return fh.read()

        def write(path, content):
            with open(path, "w", encoding="utf-8") as fh:
                fh.write(content)

        STUB_FALSE = "    .registers 1\n    const/4 v0, 0x0\n    return v0\n"
        STUB_TRUE  = "    .registers 1\n    const/4 v0, 0x1\n    return v0\n"

        # ── PATCH 1: Stub ad ContentProvider onCreate() ───────────────────
        AD_PROVIDERS = [
            "applovininitprovider",
            "mobileadsinitprovider",
            "firebaseinitprovider",
            "FirebaseInitProvider",
            "AppLovinInitProvider",
            "MobileAdsInitProvider",
            "AdsSdkInitializer",
        ]

        for path in smali_files():
            scanned += 1
            content = read(path)
            is_ad = any(p.lower() in path.lower() for p in AD_PROVIDERS)
            if not is_ad:
                continue
            new_content = re.sub(
                r'(\.method public onCreate\(\)Z[ \t]*\n)'
                r'(.*?)'
                r'(?=\.end method)',
                lambda m: m.group(1) + STUB_FALSE,
                content,
                flags=re.DOTALL
            )
            if new_content != content:
                write(path, new_content)
                patched.append(f"[AD STUB] {os.path.basename(path)}")

        # ── PATCH 2: Installer source check bypass ────────────────────────
        for path in smali_files():
            content = read(path)
            if "getInstallerPackageName" not in content:
                continue
            lines = content.split('\n')
            out   = []
            armed = False
            for line in lines:
                stripped = line.strip()
                if 'getInstallerPackageName' in line:
                    armed = True
                    out.append(line)
                    continue
                if armed:
                    if re.match(r'if-eqz\s+', stripped):
                        out.append(f"    # PATCHED-OUT: {stripped}")
                        armed = False
                        patched.append(f"[INSTALLER] if-eqz: {os.path.basename(path)}")
                        continue
                    elif re.match(r'if-nez\s+', stripped):
                        m = re.search(r'(:cond_\w+)', stripped)
                        if m:
                            out.append(f"    goto {m.group(1)}  # PATCHED")
                            armed = False
                            patched.append(f"[INSTALLER] if-nez→goto: {os.path.basename(path)}")
                            continue
                    elif re.match(r'if-eq\s+', stripped):
                        out.append(f"    # PATCHED-OUT: {stripped}")
                        armed = False
                        patched.append(f"[INSTALLER] if-eq: {os.path.basename(path)}")
                        continue
                    elif re.match(r'if-ne\s+', stripped):
                        m = re.search(r'(:cond_\w+)', stripped)
                        if m:
                            out.append(f"    goto {m.group(1)}  # PATCHED")
                            armed = False
                            patched.append(f"[INSTALLER] if-ne→goto: {os.path.basename(path)}")
                            continue
                    elif '.method ' in line:
                        armed = False
                out.append(line)
            new_content = '\n'.join(out)
            if new_content != content:
                write(path, new_content)

        # ── PATCH 3: Version whitelist bypass ─────────────────────────────
        for path in smali_files():
            content = read(path)
            if "1.26.5" not in content and "supported version" not in content.lower():
                continue
            lines = content.split('\n')
            out   = []
            in_ver_method = False
            for i, line in enumerate(lines):
                if '.method' in line:
                    lookahead = '\n'.join(lines[i:i+60])
                    if '1.26.5' in lookahead or 'supported version' in lookahead.lower():
                        in_ver_method = True
                if '.end method' in line:
                    in_ver_method = False
                if in_ver_method and line.strip() == 'const/4 v0, 0x0':
                    j = i + 1
                    while j < len(lines) and not lines[j].strip():
                        j += 1
                    if j < len(lines) and lines[j].strip().startswith('return'):
                        out.append(line.replace('0x0', '0x1'))
                        patched.append(f"[VERSION] flip: {os.path.basename(path)}")
                        continue
                out.append(line)
            new_content = '\n'.join(out)
            if new_content != content:
                write(path, new_content)

        # ── PATCH 4: Signature check bypass ───────────────────────────────
        SIG_KW = ["GET_SIGNATURES", "GET_SIGNING_CERTIFICATES"]
        for path in smali_files():
            content = read(path)
            if not any(kw in content for kw in SIG_KW):
                continue
            if "mojang" not in content.lower() and "flarial" not in path.lower():
                continue
            new_content = re.sub(
                r'(\.method (?:\w+ )*(?:verify\w+|check\w+Sig\w*|validateSig\w*)'
                r'\([^)]*\)Z[ \t]*\n)'
                r'(.*?)'
                r'(?=\.end method)',
                lambda m: m.group(1) + STUB_TRUE,
                content,
                flags=re.DOTALL | re.IGNORECASE
            )
            if new_content != content:
                write(path, new_content)
                patched.append(f"[SIG] stub: {os.path.basename(path)}")

        print(f"\n{'='*55}")
        print(f"Scanned : {scanned} smali files")
        print(f"Patches : {len(patched)}")
        for p in patched:
            print(f"  ✓ {p}")
        if not patched:
            print("  ⚠ No smali patches matched — native libs still deleted")
        print('='*55)
        PYEOF

    - name: Recompile APK
      run: |
        java -jar apktool.jar b flarial_decompiled \
          -o flarial_patched_raw.apk \
          --use-aapt2
        echo "Recompiled: $(du -sh flarial_patched_raw.apk | cut -f1)"

    - name: Zipalign
      run: |
        $ZIPALIGN -v -p 4 flarial_patched_raw.apk flarial_patched_aligned.apk
        echo "Aligned ✓"

    - name: Generate debug keystore
      run: |
        keytool -genkeypair -v \
          -keystore debug.keystore \
          -alias androiddebugkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=Android Debug,O=Android,C=US"
        echo "Keystore generated ✓"

    - name: Sign APK with apksigner
      run: |
        $APKSIGNER sign \
          --ks debug.keystore \
          --ks-key-alias androiddebugkey \
          --ks-pass pass:android \
          --key-pass pass:android \
          --v1-signing-enabled true \
          --v2-signing-enabled true \
          --v3-signing-enabled true \
          --out Flarial_FIXED_v1.apk \
          flarial_patched_aligned.apk

        # Verify it actually signed
        $APKSIGNER verify --verbose Flarial_FIXED_v1.apk
        echo "Signed: $(du -sh Flarial_FIXED_v1.apk | cut -f1)"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Flarial-FIXED-v1
        path: Flarial_FIXED_v1.apk
        retention-days: 7
