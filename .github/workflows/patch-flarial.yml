name: Patch Flarial APK

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:

    # ── 1. Checkout ──────────────────────────────────────────────────────────
    - name: Checkout repo
      uses: actions/checkout@v4

    # ── 2. Java ──────────────────────────────────────────────────────────────
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    # ── 3. Download tools ─────────────────────────────────────────────────────
    - name: Download tools
      run: |
        # apktool
        wget -q "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" \
          -O apktool.jar
        wget -q "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool" \
          -O apktool && chmod +x apktool

        # APKEditor — merges split APKs into one fat APK
        wget -q "https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar" \
          -O APKEditor.jar

        # uber-apk-signer — signs without needing a keystore
        wget -q "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar" \
          -O signer.jar

        echo "Tools downloaded ✓"

    # ── 4. Download .apks from YOUR release tag v1 ────────────────────────────
    - name: Download APKS bundle from release v1
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Fetching release v1 from ${{ github.repository }}..."

        RELEASE_JSON=$(curl -s \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/releases/tags/v1")

        # Debug: show what assets exist
        echo "Assets in release v1:"
        echo "$RELEASE_JSON" | python3 -c "
        import sys, json
        data = json.load(sys.stdin)
        if 'message' in data:
            print('ERROR:', data['message'])
            sys.exit(1)
        for a in data.get('assets', []):
            print(f'  - {a[\"name\"]} ({a[\"size\"]} bytes) → {a[\"browser_download_url\"]}')
        "

        # Find the .apks file
        APKS_URL=$(echo "$RELEASE_JSON" | python3 -c "
        import sys, json
        data = json.load(sys.stdin)
        for a in data.get('assets', []):
            if a['name'].endswith('.apks'):
                print(a['browser_download_url'])
                break
        ")

        # Fallback: also check for plain .apk
        if [ -z "$APKS_URL" ]; then
          APKS_URL=$(echo "$RELEASE_JSON" | python3 -c "
        import sys, json
        data = json.load(sys.stdin)
        for a in data.get('assets', []):
            if a['name'].endswith('.apk'):
                print(a['browser_download_url'])
                break
        ")
          IS_APK=true
        fi

        if [ -z "$APKS_URL" ]; then
          echo "ERROR: No .apks or .apk found in release v1"
          exit 1
        fi

        echo "Downloading: $APKS_URL"
        curl -L -s \
          -H "Authorization: Bearer $GH_TOKEN" \
          "$APKS_URL" -o flarial_input

        echo "Downloaded: $(du -sh flarial_input | cut -f1)"

        # Save flag for next step
        echo "IS_APK=${IS_APK:-false}" >> $GITHUB_ENV
        echo "INPUT_FILE=flarial_input" >> $GITHUB_ENV

    # ── 5. Merge splits → single APK ─────────────────────────────────────────
    - name: Merge APKS bundle into single APK
      run: |
        if [ "$IS_APK" = "true" ]; then
          echo "Input is already a plain .apk — skipping merge"
          cp flarial_input flarial_merged.apk
        else
          echo "Merging split APKs into single fat APK..."
          java -jar APKEditor.jar m \
            -i flarial_input \
            -o flarial_merged.apk
          echo "Merged: $(du -sh flarial_merged.apk | cut -f1)"
        fi

    # ── 6. Decompile ──────────────────────────────────────────────────────────
    - name: Decompile APK
      run: |
        java -jar apktool.jar d flarial_merged.apk \
          -o flarial_decompiled \
          --no-res \
          -f
        echo "Smali dirs found:"
        ls flarial_decompiled/ | grep smali

    # ── 7. Nuke anti-tamper + ad native libs ──────────────────────────────────
    - name: Delete anti-tamper and ad .so files
      run: |
        LIB_DIR="flarial_decompiled/lib"

        # Confirmed from actual APK analysis
        KILL_LIBS=(
          "libpglarmor.so"              # PGL Armor — anti-tamper
          "libapplovin-native-crash-reporter.so"  # AppLovin
          "libapminsighta.so"           # APM analytics A
          "libapminsightb.so"           # APM analytics B
          "libtt_ugen_layout.so"        # ByteDance/TikTok ads
          "libshin.so"                  # Mintegral ads
          "libmaesdk.so"                # MAE ad telemetry
        )

        DELETED=0
        for arch in arm64-v8a armeabi-v7a x86 x86_64; do
          for lib in "${KILL_LIBS[@]}"; do
            TARGET="$LIB_DIR/$arch/$lib"
            if [ -f "$TARGET" ]; then
              rm "$TARGET"
              echo "  DELETED ✓ $arch/$lib"
              ((DELETED++))
            fi
          done
        done

        echo ""
        echo "Total deleted: $DELETED .so files"

    # ── 8. Smali patches ──────────────────────────────────────────────────────
    - name: Patch smali — bypass MC checks + remove ad inits
      run: |
        python3 << 'PYEOF'
        import os, re, glob

        BASE = "flarial_decompiled"
        patched = []
        scanned = 0

        def smali_files():
            for d in sorted(glob.glob(f"{BASE}/smali*")):
                for root, _, files in os.walk(d):
                    for f in files:
                        if f.endswith(".smali"):
                            yield os.path.join(root, f)

        def read(path):
            with open(path, "r", encoding="utf-8", errors="ignore") as fh:
                return fh.read()

        def write(path, content):
            with open(path, "w", encoding="utf-8") as fh:
                fh.write(content)

        STUB_TRUE  = "\n    const/4 v0, 0x1\n    return v0\n"
        STUB_FALSE = "\n    const/4 v0, 0x0\n    return v0\n"
        STUB_VOID  = "\n    return-void\n"

        # ── PATCH 1: Stub ad ContentProvider onCreate() ───────────────────────
        AD_PROVIDERS = [
            "applovininitprovider",
            "mobileadsinitprovider",
            "firebaseinitprovider",
            "FirebaseInitProvider",
            "AppLovinInitProvider",
            "MobileAdsInitProvider",
            "AdsSdkInitializer",
            "applovin/sdk/AppLovin",
        ]

        for path in smali_files():
            scanned += 1
            content = read(path)
            is_ad = any(p.lower() in path.lower() for p in AD_PROVIDERS)
            if not is_ad:
                continue

            new_content = re.sub(
                r'(\.method public onCreate\(\)Z\s*(?:\.registers \d+\s*)?)'
                r'(.*?)'
                r'(?=\.end method)',
                lambda m: m.group(1) + STUB_FALSE,
                content,
                flags=re.DOTALL
            )
            if new_content != content:
                write(path, new_content)
                patched.append(f"[AD STUB] {os.path.basename(path)}")

        # ── PATCH 2: Installer source check bypass ────────────────────────────
        for path in smali_files():
            content = read(path)
            if "getInstallerPackageName" not in content:
                continue

            lines  = content.split('\n')
            out    = []
            armed  = False   # True = we just saw getInstallerPackageName

            for i, line in enumerate(lines):
                stripped = line.strip()

                if 'getInstallerPackageName' in line:
                    armed = True
                    out.append(line)
                    continue

                if armed:
                    # Neutralise the first conditional branch after the call
                    if re.match(r'if-eqz\s+', stripped):
                        # if-eqz vX, :fail  →  comment out (fall-through = pass)
                        out.append(f"    # PATCHED-OUT: {stripped}")
                        armed = False
                        patched.append(f"[INSTALLER] if-eqz removed in {os.path.basename(path)}")
                        continue
                    elif re.match(r'if-nez\s+', stripped):
                        # if-nez vX, :pass  →  unconditional goto :pass
                        label = re.search(r'(:cond_\w+)', stripped).group(1)
                        out.append(f"    goto {label}  # PATCHED: always pass")
                        armed = False
                        patched.append(f"[INSTALLER] if-nez→goto in {os.path.basename(path)}")
                        continue
                    elif re.match(r'if-eq\s+', stripped):
                        out.append(f"    # PATCHED-OUT: {stripped}")
                        armed = False
                        patched.append(f"[INSTALLER] if-eq removed in {os.path.basename(path)}")
                        continue
                    elif re.match(r'if-ne\s+', stripped):
                        label = re.search(r'(:cond_\w+)', stripped).group(1)
                        out.append(f"    goto {label}  # PATCHED: always pass")
                        armed = False
                        patched.append(f"[INSTALLER] if-ne→goto in {os.path.basename(path)}")
                        continue
                    # Reset if we hit a new method without finding the branch
                    elif '.method ' in line:
                        armed = False

                out.append(line)

            new_content = '\n'.join(out)
            if new_content != content:
                write(path, new_content)

        # ── PATCH 3: Version whitelist bypass ─────────────────────────────────
        for path in smali_files():
            content = read(path)
            if "1.26.5" not in content and "supported version" not in content.lower():
                continue

            lines = content.split('\n')
            out   = []
            in_ver_method = False

            for i, line in enumerate(lines):
                stripped = line.strip()

                if '.method' in line:
                    lookahead = '\n'.join(lines[i:i+60])
                    if '1.26.5' in lookahead or 'supported version' in lookahead.lower():
                        in_ver_method = True

                if '.end method' in line:
                    in_ver_method = False

                # Flip false returns inside version-check methods
                if in_ver_method and stripped == 'const/4 v0, 0x0':
                    # Peek: is next non-blank line a return?
                    j = i + 1
                    while j < len(lines) and not lines[j].strip():
                        j += 1
                    if j < len(lines) and lines[j].strip().startswith('return'):
                        out.append(line.replace('0x0', '0x1'))
                        patched.append(f"[VERSION] false→true in {os.path.basename(path)}")
                        continue

                out.append(line)

            new_content = '\n'.join(out)
            if new_content != content:
                write(path, new_content)

        # ── PATCH 4: Signature verification bypass ────────────────────────────
        SIG_KEYWORDS = ["GET_SIGNATURES", "GET_SIGNING_CERTIFICATES", "checkSignature", "verifySignature"]

        for path in smali_files():
            content = read(path)
            if not any(kw in content for kw in SIG_KEYWORDS):
                continue
            if "mojang" not in content.lower() and "flarial" not in path.lower():
                continue

            # Stub any method named verify*/check*Signature* that returns Z
            new_content = re.sub(
                r'(\.method (?:public |private |protected )*(?:static )?'
                r'(?:verify\w+|check\w+Sig\w*|validateSig\w*)'
                r'\([^)]*\)Z\s*(?:\.registers \d+\s*)?)'
                r'(.*?)'
                r'(?=\.end method)',
                lambda m: m.group(1) + STUB_TRUE,
                content,
                flags=re.DOTALL | re.IGNORECASE
            )
            if new_content != content:
                write(path, new_content)
                patched.append(f"[SIG] stub in {os.path.basename(path)}")

        # ── Summary ───────────────────────────────────────────────────────────
        print(f"\n{'='*55}")
        print(f"Scanned : {scanned} smali files")
        print(f"Patches : {len(patched)}")
        for p in patched:
            print(f"  ✓ {p}")
        if not patched:
            print("  ⚠ No smali patches matched.")
            print("  Native libs still deleted — try installing and check if MC launches.")
        print('='*55)
        PYEOF

    # ── 9. Recompile ──────────────────────────────────────────────────────────
    - name: Recompile APK
      run: |
        java -jar apktool.jar b flarial_decompiled \
          -o flarial_patched_unsigned.apk \
          --use-aapt2
        echo "Recompiled: $(du -sh flarial_patched_unsigned.apk | cut -f1)"

    # ── 10. Sign ──────────────────────────────────────────────────────────────
    - name: Sign APK
      run: |
        java -jar signer.jar \
          --apks flarial_patched_unsigned.apk \
          --out ./ \
          --allowResign \
          --overwrite

        SIGNED=$(ls *aligned-debugSigned.apk 2>/dev/null \
               || ls *aligned-signed.apk 2>/dev/null \
               || ls *signed.apk 2>/dev/null | head -1)

        mv "$SIGNED" "Flarial_FIXED_v1.apk"
        echo "Signed APK: Flarial_FIXED_v1.apk ($(du -sh Flarial_FIXED_v1.apk | cut -f1))"

    # ── 11. Upload artifact ───────────────────────────────────────────────────
    - name: Upload patched APK
      uses: actions/upload-artifact@v4
      with:
        name: Flarial-FIXED-v1
        path: Flarial_FIXED_v1.apk
        retention-days: 7
